<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#05070F;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c" width="800" height="800"></canvas><script>
const v=new URLSearchParams(location.search).get('v')||'H';
const W=800,c=document.getElementById('c'),g=c.getContext('2d');
let s=11;const R=()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296};
const st=[[56,189,248],[99,102,241],[168,85,247],[236,72,153],[251,146,60]];
function col(t,a){t=Math.min(1,Math.max(0,t));const p=t*(st.length-1),i=Math.min(st.length-2,Math.floor(p)),f=p-i;const k=st[i].map((q,j)=>Math.round(q+(st[i+1][j]-q)*f));return `rgba(${k[0]},${k[1]},${k[2]},${a})`}
const bg=g.createRadialGradient(400,380,30,400,400,640);bg.addColorStop(0,'#1A2150');bg.addColorStop(0.5,'#0B0F26');bg.addColorStop(1,'#04050C');g.fillStyle=bg;g.fillRect(0,0,W,W);
g.globalCompositeOperation='lighter';
if(v==='H'){ // neural orb
  const n=520,P=[],rad=285,ty=0.55,tx=-0.35;
  for(let i=0;i<n;i++){const y=1-2*(i+0.5)/n,r=Math.sqrt(1-y*y),th=i*2.399963;let x=Math.cos(th)*r,z=Math.sin(th)*r,yy=y;
    let x1=x*Math.cos(ty)+z*Math.sin(ty),z1=-x*Math.sin(ty)+z*Math.cos(ty);let y1=yy*Math.cos(tx)-z1*Math.sin(tx),z2=yy*Math.sin(tx)+z1*Math.cos(tx);
    P.push({x:400+x1*rad,y:400+y1*rad,z:z2,t:(y+1)/2,o:[x,yy,z]});}
  // glow core
  const cg=g.createRadialGradient(400,400,0,400,400,330);cg.addColorStop(0,'rgba(124,92,230,0.55)');cg.addColorStop(0.5,'rgba(59,130,246,0.16)');cg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=cg;g.fillRect(0,0,W,W);
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=P[i].o,b=P[j].o;const d=Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);if(d<0.2){const dep=((P[i].z+P[j].z)/2+1)/2;g.strokeStyle=col((P[i].t+P[j].t)/2,0.10+0.55*dep*dep);g.lineWidth=0.5+1.2*dep;g.beginPath();g.moveTo(P[i].x,P[i].y);g.lineTo(P[j].x,P[j].y);g.stroke();}}
  // long-range "attention" arcs through the core
  for(let k=0;k<26;k++){const a=P[(R()*n)|0],b=P[(R()*n)|0];if(a.z<0||b.z<0){k--;continue}g.strokeStyle=col((a.t+b.t)/2,0.38);g.lineWidth=1.3;g.beginPath();g.moveTo(a.x,a.y);g.quadraticCurveTo(400+(R()-0.5)*90,400+(R()-0.5)*90,b.x,b.y);g.stroke();}
  P.sort((a,b)=>a.z-b.z).forEach(p=>{const dep=(p.z+1)/2;g.shadowColor=col(p.t,1);g.shadowBlur=14*dep;g.fillStyle=col(p.t,0.25+0.75*dep);g.beginPath();g.arc(p.x,p.y,1+3.6*dep*dep,0,7);g.fill();});
  // a few hot nodes
  g.shadowBlur=30;for(let k=0;k<9;k++){const p=P[n-1-((R()*120)|0)];g.shadowColor='#fff';g.fillStyle='rgba(255,255,255,0.95)';g.beginPath();g.arc(p.x,p.y,4.5,0,7);g.fill();}
}
if(v==='I'){ // attention chord ring
  const n=36,rad=300,T=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2-Math.PI/2;T.push([400+Math.cos(a)*rad,400+Math.sin(a)*rad,i/n,a])}
  for(let i=0;i<n;i++){const m=3+((R()*5)|0);for(let k=0;k<m;k++){const j=(i+2+((R()*(n-4))|0))%n;const w=R();g.strokeStyle=col((T[i][2]+T[j][2])/2,0.08+0.5*w*w);g.lineWidth=0.6+3.2*w*w;g.shadowColor=col(T[i][2],0.9);g.shadowBlur=w>0.75?16:0;g.beginPath();g.moveTo(T[i][0],T[i][1]);g.quadraticCurveTo(400,400,T[j][0],T[j][1]);g.stroke();}}
  T.forEach(t=>{g.shadowColor=col(t[2],1);g.shadowBlur=22;g.fillStyle=col(t[2],1);g.beginPath();g.arc(t[0],t[1],8,0,7);g.fill();g.fillStyle='rgba(255,255,255,0.9)';g.beginPath();g.arc(t[0],t[1],3,0,7);g.fill();});
}
if(v==='J'){ // latent flow field
  const f=(x,y)=>Math.sin(x*0.006+1.3)*1.6+Math.cos(y*0.007-0.4)*1.7+Math.sin((x+y)*0.004)*1.2+Math.atan2(y-400,x-400)*0.9;
  for(let k=0;k<1500;k++){let x=R()*W,y=R()*W;const t=R();g.strokeStyle=col(t*0.25+Math.hypot(x-400,y-400)/520*0.75,0.16);g.lineWidth=0.7+R()*1.6;g.beginPath();g.moveTo(x,y);for(let i=0;i<70;i++){const a=f(x,y);x+=Math.cos(a)*4;y+=Math.sin(a)*4;g.lineTo(x,y)}g.stroke();}
}
g.globalCompositeOperation='source-over';g.shadowBlur=0;const vg=g.createRadialGradient(400,400,310,400,400,580);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(3,4,10,0.9)');g.fillStyle=vg;g.fillRect(0,0,W,W);
</script></body></html>
