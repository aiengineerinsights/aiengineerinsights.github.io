<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — AI Engineer Insights</title>
    <!--
      Real 404 page. Previously this was the spa-github-pages JS redirect
      (404 -> /?/path -> homepage), which Google reported as "Redirect error".
      Every real route is prerendered to its own index.html, and moved URLs get
      a static redirect stub under public/blog/<old-slug>/, so nothing needs it.
    -->
    <meta name="robots" content="noindex">
    <style>
      :root { --bg:#f7f9fb; --fg:#0f172a; --muted:#475569; --accent:#0e7490; }
      @media (prefers-color-scheme: dark) { :root { --bg:#0a0f16; --fg:#e2e8f0; --muted:#94a3b8; --accent:#22d3ee; } }
      body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
      main { max-width:40rem; margin:0 auto; padding:4rem 1rem; }
      h1 { font-size:1.9rem; line-height:1.2; margin:0 0 .75rem; }
      p { color:var(--muted); }
      ul { padding-left:1.1rem; }
      a { color:var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>This page doesn't exist</h1>
      <p>The link may be old or mistyped. Try one of these instead:</p>
      <ul>
        <li><a href="/blogs/">All articles</a></li>
        <li><a href="/ai-engineering-roadmap/">AI Engineer Roadmap 2026</a></li>
        <li><a href="/blog/best-ai-coding-agents/">Best AI coding agents</a></li>
        <li><a href="/blog/hermes-agent-alternatives/">Hermes Agent alternatives</a></li>
        <li><a href="/">Home</a></li>
      </ul>
    </main>
  </body>
</html>
